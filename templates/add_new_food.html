<!doctype html>
<html lang="en">
  <head>
    <title>Add New Food</title>
  </head>
  <body>
    <h1>Add New Food</h1>
    <form action="{{ url_for('add_new_food') }}" method="post">
      <label for="food_name">Food Name:</label><br />
      <input type="text" id="food_name" name="food_name" required /><br />
      <label for="dietary_class">Dietary Class:</label><br />
      <select name="dietary_class" id="dietary_class">
          <option value="1">None</option>
          <option value="2">Vegetarian</option>
          <option value="3">Vegan</option>
      <input type="submit" value="Submit" />
      </select><br /><br />
    </form>
  </body>
</html>
