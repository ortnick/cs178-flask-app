<!DOCTYPE html>
<html lang="en">
<head>
    <title>Users List</title>
    <!-- Bootstrap CSS for styling the table -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2 class="mt-5">Users List</h2>
        <table class="table table-bordered table-striped mt-3">
            <thead class="thead-dark"> <!-- creates a dark background for the table header -->
                <tr>
                    <th>Food</th>
                    <th>Dietary Type</th>
                    <th>Ease of Making</th>
                    <th>Taste</th>
                    <th>Total Score</th>
                </tr>
            </thead>
            <tbody> <!-- table body -- loop through all of the users -->
                {% for output in outputs %}
                <tr>
                    <td>{{ output[0] }}</td>
                    <td>{{ output.diet }}</td>
                    <td>{{ output.ease }}</td>
                    <td>{{ output.taste }}</td>
                    <td>{{ output.total }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
 </body>
</html>
